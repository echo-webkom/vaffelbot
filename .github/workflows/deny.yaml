name: 🛡️ Cargo Deny

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-deny:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v6

      - name: 🛡️ Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
