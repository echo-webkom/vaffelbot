# Configuration for cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# Only ignore advisories that can't be fixed yet, and always give a reason!
[advisories]
ignore = [
  # rustls-webpki 0.102 is pinned by serenity 0.12
  # https://github.com/serenity-rs/serenity/issues/3557
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 pinned by serenity" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 pinned by serenity" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 pinned by serenity" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 pinned by serenity" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
